global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'sift-api'
    static_configs:
      - targets: ['host.docker.internal:3000']
  - job_name: 'sift-crawler'
    static_configs:
      - targets: ['host.docker.internal:3001']
  - job_name: 'sift-indexer'
    static_configs:
      - targets: ['host.docker.internal:3002']
